# Turns a "Share learned data" issue into a pull request.
#
# A player pastes their /ag share export into the issue form. This reads it with
# tools/learned_intake.py (which validates every line), merges it into
# tools/learned/community.json, rebuilds Data/Generated/Community.lua, runs the tests, and
# opens a pull request for a maintainer to review. Nothing reaches players until it's merged.
#
# The issue text is passed to the script only through an environment variable, never
# pasted into a shell command, so a crafted issue can't run code.
#
# Needs: Settings > Actions > General > Workflow permissions >
#        "Allow GitHub Actions to create and approve pull requests".

name: Learned data intake

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: learned-data
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.body, 'AGF1 version=')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r tools/requirements.txt

      - name: Read the submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >
          python tools/learned_intake.py --from-env
          --summary "$RUNNER_TEMP/summary.md" --error "$RUNNER_TEMP/error.txt"

      - name: Run the tests
        run: python -m unittest tools/test_addon.py

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add tools/learned/community.json AdventureGuideForever/Data/Generated/Community.lua
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --body "Thanks! Everything in this share is already in the guide, so there's nothing new to add."
            gh issue close "$ISSUE_NUMBER"
            exit 0
          fi
          branch="learned/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "data: learned data shared in #$ISSUE_NUMBER"
          git push --force origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Learned data from #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/summary.md")
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for sharing! The data checked out and is waiting for review here: $url"

      - name: Explain a rejected submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          reason="Something went wrong while reading it."
          if [ -s "$RUNNER_TEMP/error.txt" ]; then reason=$(cat "$RUNNER_TEMP/error.txt"); fi
          {
            echo "Thanks for sharing! The bot couldn't add this one:"
            echo
            echo "> $reason"
            echo
            echo "Try \`/ag share\` again in game, copy everything in the big box, and open a new issue with it."
          } > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/reply.md"
