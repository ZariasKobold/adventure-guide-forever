name: Share learned data
description: Paste what your learning mode found (from /ag share in game) to add it to the guide for everyone.
title: "[Learned] Data from the game"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the guide grow!

        1. In game, type `/ag share` (or click **Share with the guide...** in the guide's Options).
        2. Click in the big box, press **Ctrl+C**, and paste it below.
        3. Click **Submit new issue**.

        A bot checks the data and opens a pull request. Once it's reviewed and merged, the next
        release of Adventure Guide Forever includes what you found.

        The paste holds only boss, item, and spell IDs, kill counts, and a random ID (so a newer
        share from you replaces your older one). It has no character names. Issues are public.
  - type: textarea
    id: data
    attributes:
      label: Learned data
      description: Starts with a line beginning AGF1 and ends with a line beginning END.
      placeholder: |
        AGF1 version=0.5.0 id=...
        B kroldok overlordmugg kills=3 npc=... display=... name=Overlord Mugg
        ...
        END 12
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Notes about the fights, things that seemed different from the guide, etc.
    validations:
      required: false
