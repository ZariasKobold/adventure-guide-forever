# The share page (see worker/README.md for setup).
name = "agf-share"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
REPO = "ZariasKobold/adventure-guide-forever"
# Turnstile's public site key (Cloudflare dashboard > Turnstile). Leave empty to skip the
# bot check while testing locally. Its secret key goes in with `wrangler secret put TURNSTILE_SECRET`.
TURNSTILE_SITE_KEY = "0x4AAAAAAGID7lwB6FJdq5Hn"
